  build:
    name: Build and push
    # needs: test
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      build-args: |
        KOITO_VERSION=dev
      meta-images: ghcr.io/${{ github.repository_owner }}/koito
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

